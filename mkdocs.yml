site_name: Xilinx
#site_url: ''
use_directory_urls: false

extra_css: [extra.css]

theme:
     name: readthedocs
     features:
         - content.code.copy
         - content.code.annotate   

nav:
    - Home: index.md
    - Blink: blink.md
    - Процессор: proc.md
    - PS-PL: ps_pl.md
    - Vitis: vitis.md
    - U-Boot: uboot.md
    - Настройки U-Boot: usettings.md
    - AMP: amp.md
#   - Пример проекта: example.md
    - Отладка и запуск CPU1: debug.md
    - PS-PL 2: pspl2.md
    - Пример проекта на гитхабе: github.md
    - PCIE: pcie.md
    - Функциональная схема: description.md

markdown_extensions:
    - toc:
        permalink: "🔗"
        baselevel: 1
    - admonition
    - mdx_math
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.details
    - pymdownx.superfences
    - attr_list
    - footnotes


